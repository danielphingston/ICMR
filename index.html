<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#244e42">
  <meta name="description" content="A private, offline clinical nutrition workspace. Patient assessments, clinical energy and macro targets, daily diet prescriptions and meal portion reconciliation.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Nourish — Clinical nutrition workspace</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to workspace</a>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript>This local nutrition planner needs JavaScript to calculate and save patient plans.</noscript>
  <script type="module" src="./app.js"></script>
